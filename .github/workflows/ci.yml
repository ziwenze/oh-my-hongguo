name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run offline unit tests
        run: npm test

      - name: Run production build
        run: npm run build

      - name: Run Electron smoke test (Linux with xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:smoke

      - name: Run Electron smoke test (macOS & Windows)
        if: runner.os != 'Linux'
        run: npm run test:smoke
