name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck and offline tests
        run: |
          npm run typecheck
          npm test

      - name: Build production app
        run: npm run build

      - name: Package with electron-builder (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify macOS Artifacts (.dmg and .zip)
        if: runner.os == 'macOS'
        run: |
          ls -la release/
          test -n "$(ls release/*.dmg 2>/dev/null)" || { echo "Missing .dmg artifact!"; exit 1; }
          test -n "$(ls release/*.zip 2>/dev/null)" || { echo "Missing .zip artifact!"; exit 1; }
          echo "macOS artifacts (.dmg and .zip) verified successfully."

      - name: Package with electron-builder (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win

      - name: Verify Windows Artifacts (NSIS and Portable .exe)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ls -la release/
          test -n "$(ls release/*Setup*.exe 2>/dev/null)" || { echo "Missing NSIS Setup .exe artifact!"; exit 1; }
          test -n "$(ls release/*Portable*.exe 2>/dev/null)" || { echo "Missing Portable .exe artifact!"; exit 1; }
          echo "Windows artifacts (NSIS Setup and Portable .exe) verified successfully."

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error
